name: Build ModSwitch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ModSwitch project
        run: |
          unzip -q ModSwitch-1.20.1-v2-source.zip -d project
          find project -maxdepth 4 -type f

      - name: Locate Gradle project
        id: locate
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build ModSwitch
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon clean build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: ModSwitch-Fabric-1.20.1
          path: |
            ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
            !${{ steps.locate.outputs.project_dir }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
          
